      content="Tell Coreside what you need. Build personal apps right inside your workspace, then keep changing them as your needs change."

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Flash Prevention Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('coreside-theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white transition-colors duration-200 min-h-screen">
